[project]
name = "cinematch"
version = "1.0.0"
description = "CineMatch: Movie Recommendation & Discovery System"
requires-python = ">=3.12"
# Only direct application dependencies belong here; transitive packages are
# resolved into uv.lock. Unused Flask, TensorFlow/OpenCV and other stray ML
# packages were removed — they were never imported by this Django app.
dependencies = [
    "cloudinary==1.44.1",
    "dj-database-url==3.1.2",
    "django==6.0.2",
    "django-cloudinary-storage==0.3.0",
    "djangorestframework==3.16.1",
    "gunicorn==25.1.0",
    "pillow==12.1.1",
    "psycopg2==2.9.11",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "textblob==0.19.0",
    "tzdata==2025.3",
    "whitenoise==6.11.0",
]

[tool.uv]
# This is an application, not a library: sync installs dependencies only
# instead of trying to build/install the project itself.
package = false
